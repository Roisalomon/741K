[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# Le site n'utilise aucune variable d'environnement secrète :
# on désactive le scan de secrets pour qu'il ne bloque plus jamais un déploiement.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Plus de 'unsafe-inline' : le script est maintenant un fichier externe (/app.js),
    # ce qui empêche l'exécution de tout script injecté directement dans la page.
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' data: blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
