[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

# Le site n'utilise aucune variable d'environnement secrète :
# on désactive le scan de secrets pour qu'il ne bloque plus jamais un déploiement.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; media-src 'self' data: blob:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"
